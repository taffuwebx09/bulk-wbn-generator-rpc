name: Publish v1.4.0 complete source
on:
  push:
    branches: [main]
    paths:
      - "_bootstrap/READY"
permissions:
  contents: write
jobs:
  unpack-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and safely unpack complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/source-*.b64 | base64 --decode > /tmp/bulk-wbn-source.zip
          python3 - <<'PY'
          import pathlib, zipfile
          from zipfile import BadZipFile
          archive = "/tmp/bulk-wbn-source.zip"
          destination = pathlib.Path("/tmp/bulk-wbn-source")
          destination.mkdir(parents=True, exist_ok=True)
          required = {
              "package.json",
              "client/src/App.jsx",
              "server/src/index.js",
              "extension/manifest.json",
          }
          seen = set()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename
                  rel = pathlib.PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if info.is_dir():
                      (destination / pathlib.Path(*rel.parts)).mkdir(parents=True, exist_ok=True)
                      continue
                  try:
                      payload = z.read(info)
                  except BadZipFile:
                      if name.startswith("public/downloads/") and name.endswith(".zip"):
                          print(f"Will regenerate damaged downloadable asset: {name}")
                          continue
                      raise
                  seen.add(name)
                  target = destination / pathlib.Path(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
          missing = required - seen
          if missing:
              raise SystemExit(f"Archive missing required files: {sorted(missing)}")
          PY
          rsync -a --exclude='.git/' /tmp/bulk-wbn-source/ ./
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml
          # GitHub App connection has contents permission but not workflow permission.
          # The project itself does not depend on this optional CI workflow.
          rm -f .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild Extension and Local Processor download ZIPs
        run: npm run package:downloads
      - name: Run automated backend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Commit complete project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Bulk WBN Generator RPC v1.4.0 complete source"
          git push origin main
