name: Publish v1.4.0 complete source
on:
  push:
    branches: [main]
    paths:
      - "_bootstrap/READY"
permissions:
  contents: write
jobs:
  unpack-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and unpack complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/source-*.b64 | base64 --decode > /tmp/bulk-wbn-source.zip
          python3 - <<'PY'
          import zipfile
          archive = "/tmp/bulk-wbn-source.zip"
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = set(z.namelist())
              required = [
                  "package.json",
                  "client/src/App.jsx",
                  "server/src/index.js",
                  "extension/manifest.json",
              ]
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit(f"Archive missing required files: {missing}")
              z.extractall("/tmp/bulk-wbn-source")
          PY
          rsync -a --exclude='.git/' /tmp/bulk-wbn-source/ ./
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated backend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Commit complete project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Bulk WBN Generator RPC v1.4.0 complete source"
          git push origin main
